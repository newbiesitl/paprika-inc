name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issues are public. Use invented examples and remove private runtime data. Report security vulnerabilities privately.
  - type: input
    id: versions
    attributes:
      label: Inc commit and Messenger version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Environment and steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
