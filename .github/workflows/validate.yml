name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; same reviewed pin as Messenger
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; reviewed Messenger pin
        with:
          node-version: '24'
      - name: Validate repository and pinned dependency
        run: python3 scripts/validate-repository.py
      - name: Test authoring, Git checkout and native host contracts
        run: node --test tests/*.test.mjs
      - name: Test package completeness and determinism
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate plugin source
        run: python3 scripts/validate-plugin.py
      - name: Prepare deterministic plugin kit
        run: python3 scripts/prepare-plugin.py
      - name: Check whitespace
        run: git show --format= --check HEAD
